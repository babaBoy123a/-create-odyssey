name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          if [ -f create_odyssey_source.zip ]; then unzip -q create_odyssey_source.zip && cd create_odyssey; fi
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: create_odyssey-jar
          path: out/*.jar
          if-no-files-found: error
